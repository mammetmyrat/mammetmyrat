<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.55" stop-color="#7a5cff"/>
      <stop offset="1" stop-color="#39ff88"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00f0ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1b2735" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#7a5cff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="round"><rect width="1000" height="320" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="320" fill="#0d1117"/>
    <rect width="1000" height="320" fill="url(#grid)"/>
    <rect width="1000" height="320" fill="url(#glow)"/>

    <!-- scanning line -->
    <rect x="0" y="-60" width="1000" height="60" fill="url(#fade)">
      <animate attributeName="y" from="-60" to="320" dur="4.5s" repeatCount="indefinite"/>
    </rect>

    <!-- floating code -->
    <g font-family="'SF Mono','JetBrains Mono',Consolas,monospace" font-size="13" fill="#2b3b52">
      <text x="40" y="60">fun main() = application {</text>
      <text x="720" y="52">@Composable fun App()</text>
      <text x="760" y="290">suspend fun fetch(): Flow</text>
      <text x="30" y="290">val stack = KMP + Compose</text>
      <text x="830" y="150">0x4B6F746C696E</text>
      <text x="20" y="160">01001011 01001101 01010000</text>
    </g>

    <!-- corner brackets -->
    <g stroke="#00f0ff" stroke-width="2" fill="none" opacity="0.8">
      <path d="M20 50V20H50"/>
      <path d="M950 20H980V50"/>
      <path d="M20 270V300H50"/>
      <path d="M980 270V300H950"/>
    </g>

    <!-- top status bar -->
    <g font-family="'SF Mono','JetBrains Mono',Consolas,monospace" font-size="12" fill="#6b7a90">
      <circle cx="40" cy="38" r="5" fill="#ff5f57"/>
      <circle cx="58" cy="38" r="5" fill="#febc2e"/>
      <circle cx="76" cy="38" r="5" fill="#28c840"/>
      <text x="100" y="42">mammet@ashgabat:~$ ./portfolio --run</text>
      <circle cx="925" cy="38" r="4" fill="#39ff88">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="935" y="42" fill="#39ff88">ONLINE</text>
    </g>

    <!-- title -->
    <g text-anchor="middle" font-family="'SF Mono','JetBrains Mono',Consolas,monospace">
      <text x="500" y="160" font-size="84" font-weight="800" fill="url(#neon)" filter="url(#blur)" opacity="0.6" letter-spacing="8">MAMMET</text>
      <text x="500" y="160" font-size="84" font-weight="800" fill="url(#neon)" letter-spacing="8">MAMMET</text>
      <text x="500" y="205" font-size="20" fill="#c9d1d9" letter-spacing="4">ANDROID  ·  ANDROID TV  ·  KOTLIN MULTIPLATFORM</text>
      <text x="500" y="240" font-size="14" fill="#6b7a90" letter-spacing="2">
        <tspan fill="#39ff88">&gt;</tspan> building apps since 2021 <tspan fill="#00f0ff">//</tspan> Ashgabat, Turkmenistan
        <tspan fill="#00f0ff">
          <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>_</tspan>
      </text>
    </g>

    <!-- bottom progress line -->
    <rect x="40" y="304" width="920" height="2" fill="#1b2735"/>
    <rect x="40" y="304" width="140" height="2" fill="url(#neon)">
      <animate attributeName="x" values="40;820;40" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="0.5" y="0.5" width="999" height="319" rx="16" fill="none" stroke="#1f2a37"/>
</svg>
